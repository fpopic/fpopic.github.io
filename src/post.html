<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post - Personal Page</title>

    <!-- 1. Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- 3. Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>

    <!-- Highlight.js Line Numbers Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlightjs-line-numbers.js@2.8.0/dist/styles/github.min.css">

    <!-- 4. Configuration -->
    <style>
        :root {
            --bg-color: #f3f4f6;
            --text-color: #111827;
            --border-color: #000000;
            --accent-color: #7c3aed;
            --accent-text: #ffffff;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        .custom-border { border-color: var(--border-color); }

        /* Custom styling for code blocks */
        pre code.hljs {
            padding: 1.5rem;
            /* Removed border-radius here to let the container handle it */
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        /* Line numbers styling override */
        .hljs-ln-numbers {
            padding-right: 1rem !important;
            border-right: 1px solid #30363d !important;
            margin-right: 1rem !important;
            text-align: right;
            color: #6e7681;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .hljs-ln-code {
            padding-left: 1rem !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-8">

    <!-- MAIN CONTAINER -->
    <div class="w-full max-w-[1200px] border-2 custom-border bg-white shadow-2xl">

        <!-- HEADER -->
        <div id="header-placeholder"></div>
        <script>
            fetch('header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header-placeholder').innerHTML = data;
                    // Inject specific links for this page
                    const navLinks = document.getElementById('nav-links');
                    if (navLinks) {
                        navLinks.innerHTML = `
                            <a href="index.html" class="hover:text-[var(--accent-color)] transition-colors">Home</a>
                        `;
                    }
                });
        </script>

        <!-- POST CONTENT CONTAINER -->
        <div class="p-10 md:p-16">
            <div id="post-content-placeholder">
                <p class="text-center opacity-60">Loading post...</p>
            </div>
        </div>

        <!-- FOOTER -->
        <div id="footer-placeholder"></div>
        <script>
            fetch('footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-placeholder').innerHTML = data;
                });
        </script>

    </div>

    <script>
        // Logic to load the specific post content based on URL parameter
        // Example: post.html?id=my-first-post will try to load posts/my-first-post.html

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (postId) {
            fetch(`posts/${postId}.html`)
                .then(response => {
                    if (!response.ok) throw new Error("Post not found");
                    return response.text();
                })
                .then(data => {
                    document.getElementById('post-content-placeholder').innerHTML = data;
                    // Apply syntax highlighting to any code blocks in the loaded content
                    document.querySelectorAll('pre code').forEach((block) => {
                        // Smart indentation fix
                        let lines = block.textContent.split('\n');

                        // Remove empty lines from start and end
                        while (lines.length > 0 && lines[0].trim() === '') lines.shift();
                        while (lines.length > 0 && lines[lines.length - 1].trim() === '') lines.pop();

                        // Find minimum indentation
                        let minIndent = Infinity;
                        lines.forEach(line => {
                            if (line.trim().length > 0) {
                                const indent = line.search(/\S/);
                                if (indent !== -1 && indent < minIndent) {
                                    minIndent = indent;
                                }
                            }
                        });

                        // Apply de-indentation if needed
                        if (minIndent !== Infinity && minIndent > 0) {
                            lines = lines.map(line => {
                                // Only de-indent if the line is long enough, otherwise leave empty lines empty
                                return line.length >= minIndent ? line.slice(minIndent) : line;
                            });
                        }

                        block.textContent = lines.join('\n');
                        hljs.highlightElement(block);
                        hljs.lineNumbersBlock(block);
                    });
                })
                .catch(error => {
                    document.getElementById('post-content-placeholder').innerHTML = `
                        <div class="text-center">
                            <h1 class="text-4xl font-bold mb-4">404</h1>
                            <p class="text-xl">Post not found.</p>
                            <a href="index.html" class="text-[var(--accent-color)] underline mt-4 block">Back to Home</a>
                        </div>
                    `;
                });
        } else {
            document.getElementById('post-content-placeholder').innerHTML = `
                <div class="text-center">
                    <p class="text-xl">No post specified.</p>
                    <a href="index.html" class="text-[var(--accent-color)] underline mt-4 block">Back to Home</a>
                </div>
            `;
        }
    </script>

</body>
</html>
